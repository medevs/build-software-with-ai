<!doctype html>
<!-- og-template.html — 1200×630 social-card template, in the site's own Data Sheet
     world: an ink field carrying the count, a white sheet carrying the title.
     Not deployed. Open locally with query params and screenshot at 1200×630 into
     assets/og/:
       ?k=KICKER&t=TITLE&s=SUBTITLE&n=BIG-NUMBER&u=UNITS&a=%23ink-hex
     e.g. tools/og-template.html?k=Course%20B&t=The%20Agentic%20Coding%20Course&n=30
     `n` is a real count from the site — never invent one. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #fff; color: #14141c;
    font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
    display: grid; grid-template-columns: 400px 1fr;
    border-bottom: 10px solid #14141c;
  }
  .field {
    background: var(--a, #2b3a8f); color: #fff;
    padding: 54px 48px 48px; display: flex; flex-direction: column;
  }
  .mark { font-size: 24px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .2em; line-height: 1.5; margin: 0 0 auto; }
  .mark b { display: block; }
  .num { font-size: 190px; font-weight: 700; line-height: .78; letter-spacing: -.06em; }
  .units { font-size: 19px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .13em; line-height: 1.75; margin-top: 24px; }
  .units span { display: block; }
  .sheet { padding: 54px 66px 48px; display: flex; flex-direction: column;
    border-left: 3px solid #14141c; }
  .kicker { text-transform: uppercase; letter-spacing: .18em; font-size: 23px;
    font-weight: 700; color: var(--a, #2b3a8f); margin-bottom: 26px; }
  h1 { font-size: 74px; line-height: 1.0; letter-spacing: -.035em; font-weight: 700;
    max-width: 20ch; margin-bottom: 26px; }
  .sub { font-family: Charter, "Bitstream Charter", "Sitka Text", Georgia, serif;
    font-size: 29px; line-height: 1.45; color: #4c4c5a; max-width: 40ch; margin-bottom: auto; }
  .foot { display: flex; align-items: baseline; gap: 16px; font-size: 19px; white-space: nowrap;
    font-weight: 700; text-transform: uppercase; letter-spacing: .13em; color: #6d6d7c;
    border-top: 3px solid #14141c; padding-top: 20px; }
  .foot b { color: #14141c; }
</style>
</head>
<body>
<div class="field">
  <p class="mark">AI Builder<b>Academy</b></p>
  <p class="num" id="n">60</p>
  <p class="units" id="u"><span>Lessons</span><span>Free · self-paced</span></p>
</div>
<div class="sheet">
  <div class="kicker" id="k">Two courses · one goal</div>
  <h1 id="t">Ship real software with AI — and know it's good.</h1>
  <div class="sub" id="s">Free, self-paced courses on what good software needs and the
    system for building it reliably with an AI agent.</div>
  <div class="foot"><b>medevs.github.io</b> · free · no accounts</div>
</div>
<script>
  var q = new URLSearchParams(location.search);
  ["k", "t", "s", "n"].forEach(function (id) {
    if (q.get(id)) document.getElementById(id).textContent = q.get(id);
  });
  if (q.get("u"))
    document.getElementById("u").innerHTML =
      q.get("u").split("|").map(function (l) {
        return "<span>" + l.replace(/[<>&]/g, "") + "</span>";
      }).join("");
  if (q.get("a")) document.body.style.setProperty("--a", q.get("a"));
</script>
</body>
</html>
